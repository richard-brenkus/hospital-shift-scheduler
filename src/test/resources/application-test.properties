spring.application.name=shift-scheduler-modernized

# Database & JPA
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Languages
spring.messages.basename=language/messages
spring.messages.encoding=UTF-8

# Session
server.servlet.session.persistent=false
server.servlet.session.cookie.name=SHIFT_SCHEDULER_SESSION
server.servlet.session.timeout=10m

# Logging
logging.level.org.hibernate.SQL=ERROR

# Server
server.port=8080

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application
app.shift-types.count=6
# Application timezone used for planned task execution.
# This keeps reminders and cleanup aligned with Czech time even on a cloud server in another timezone.
app.time-zone=Europe/Prague

# How often the executor checks the database for due planned tasks.
planned-tasks.executor.fixed-delay-ms=60000

