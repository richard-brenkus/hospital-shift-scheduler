<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta charset="UTF-8">

    <title th:text="#{change.password.header}">
        Change password
    </title>

    <link rel="stylesheet"
          th:href="@{/styles/main.css}"/>
</head>

<body>

<main class="centered change-password-wrapper">

    <header class="page-header">
        <h1 th:text="#{change.password.header}">
            Change password
        </h1>
    </header>

    <section class="page-section">

        <form th:action="@{/user/change_password}"
              method="post"
              th:object="${passwordChangeForm}"
              class="change-password-form">

            <table class="table-with-lines change-password-table">

                <tbody>

                <!-- Current password -->
                <tr>
                    <td class="change-password-label-cell">
                        <label for="oldPassword"
                               th:text="#{change.password.current}">
                            Current password:
                        </label>
                    </td>

                    <td class="change-password-input-cell"
                        th:classappend="${#fields.hasErrors('oldPassword')}
                            ? ' error-red'">

                        <input type="password"
                               id="oldPassword"
                               th:field="*{oldPassword}"
                               autocomplete="off"/>
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${#fields.hasErrors('oldPassword')}"
                        th:errors="*{oldPassword}">
                        Current password is not correct
                    </td>
                </tr>

                <!-- New password -->
                <tr>
                    <td class="change-password-label-cell">
                        <label for="newPassword"
                               th:text="#{change.password.new}">
                            New password:
                        </label>
                    </td>

                    <td class="change-password-input-cell"
                        th:classappend="${#fields.hasErrors('newPassword')}
                            ? ' error-red'">

                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"
                               autocomplete="new-password"/>
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}">
                        Password error
                    </td>
                </tr>

                <!-- Confirm new password -->
                <tr>
                    <td class="change-password-label-cell">
                        <label for="confirmedPassword"
                               th:text="#{change.password.confirm}">
                            Confirm new password:
                        </label>
                    </td>

                    <td class="change-password-input-cell"
                        th:classappend="${#fields.hasErrors('confirmedPassword')}
                            ? ' error-red'">

                        <input type="password"
                               id="confirmedPassword"
                               th:field="*{confirmedPassword}"
                               autocomplete="new-password"/>
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${#fields.hasErrors('confirmedPassword')}"
                        th:errors="*{confirmedPassword}">
                        Passwords must match
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        th:text="#{button.change}">
                    Change
                </button>
            </div>

        </form>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/user/userIndex}"
           class="standard-button button-link"
           th:text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

</body>
</html>
