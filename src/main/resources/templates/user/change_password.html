<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <title>Change password</title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<main class="centered change-password-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{change.password.header}">
            Change password
        </h1>
    </header>

    <section class="page-section">

        <form th:action="@{/user/change_password}"
              method="post"
              th:object="${passwordChangeForm}"
              class="change-password-form">

            <table class="table-with-lines change-password-table">

                <tbody>

                <tr>
                    <td class="change-password-label-cell">
                        <label for="newPassword"
                               data-th-text="#{change.password.new}">
                            New password:
                        </label>
                    </td>

                    <td class="change-password-input-cell"
                        th:classappend="${#fields.hasErrors('newPassword')} ? ' error-red'">
                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"/>
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}">
                        Password error
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${noMatch == true}"
                        data-th-text="#{change.password.mustMatch}">
                        passwords must match
                    </td>
                </tr>

                <tr>
                    <td class="change-password-label-cell">
                        <label for="confirmedPassword"
                               data-th-text="#{change.password.confirm}">
                            Confirm new password:
                        </label>
                    </td>

                    <td class="change-password-input-cell"
                        th:classappend="${#fields.hasErrors('confirmedPassword') || noMatch == true} ? ' error-red'">
                        <input type="password"
                               id="confirmedPassword"
                               th:field="*{confirmedPassword}"/>
                    </td>

                    <td class="change-password-error-cell"
                        th:if="${noMatch == true}"
                        data-th-text="#{change.password.mustMatch}">
                        passwords must match
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        data-th-text="#{button.change}">
                    Change
                </button>
            </div>

        </form>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

</body>
</html>
