<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <title>Admin index</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="admin-index-wrapper centered">

    <header class="page-header">
        <h1>
            <span data-th-text="#{header.indexPage.admin}">Welcome, </span>
            <span th:text="${displayName}"></span>
        </h1>
    </header>

    <section class="page-section">
        <div class="admin-index-progress">
            <label for="submittedRequests"
                   data-th-text="#{requestsInfo.indexPage}">
                Submitted requests (admin excluded):
            </label>

            <progress id="submittedRequests"
                      th:value="${shiftRequestCount}"
                      th:max="${userCount}">
            </progress>

            <span th:text="${percentage}"> percentage</span>
        </div>
    </section>

    <section class="admin-index-planned-tasks">

        <h2 class="centered"
            data-th-text="#{scheduledTasks.header}">
            Scheduled tasks
        </h2>

        <section class="planned-task-section planned-task-section-compact">

            <h3 class="centered"
                data-th-text="#{scheduledTasks.header.reminder}">
                Remind users to submit a shift request
            </h3>

            <table class="table-with-lines planned-task-table">
                <colgroup>
                    <col class="planned-task-label-column">
                    <col class="planned-task-value-column">
                </colgroup>

                <tbody>
                <tr th:if="${sendReminderTaskRecord.reminderIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{scheduledTasks.status}">
                        Status
                    </td>
                    <td data-th-text="#{scheduledTasks.activeTask}">
                        Active task
                    </td>
                </tr>

                <tr th:unless="${sendReminderTaskRecord.reminderIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{scheduledTasks.status}">
                        Status
                    </td>
                    <td data-th-text="#{scheduledTasks.reminder.noneActive}">
                        There is no active reminder task.
                    </td>
                </tr>

                <tr th:if="${sendReminderTaskRecord.reminderIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{reminderTaskInfo.startSending}">
                        Start sending
                    </td>
                    <td th:text="${#temporals.format(sendReminderTaskRecord.reminderStart, 'dd.MM.yyyy HH:mm')}">
                        10.07.2026 08:00
                    </td>
                </tr>
                </tbody>
            </table>

        </section>

        <section class="planned-task-section planned-task-section-compact">

            <h3 class="centered"
                data-th-text="#{scheduledTasks.header.cleanup}">
                Delete all requests
            </h3>

            <table class="table-with-lines planned-task-table">
                <colgroup>
                    <col class="planned-task-label-column">
                    <col class="planned-task-value-column">
                </colgroup>

                <tbody>
                <tr th:if="${cleanupTaskRecord.cleanupIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{scheduledTasks.status}">
                        Status
                    </td>
                    <td data-th-text="#{scheduledTasks.activeTask}">
                        Active task
                    </td>
                </tr>

                <tr th:unless="${cleanupTaskRecord.cleanupIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{scheduledTasks.status}">
                        Status
                    </td>
                    <td data-th-text="#{scheduledTasks.cleanup.noneActive}">
                        There is no active cleanup task.
                    </td>
                </tr>

                <tr th:if="${cleanupTaskRecord.cleanupIsActive}">
                    <td class="planned-task-display-label"
                        data-th-text="#{cleanupTaskInfo.scheduled}">
                        Scheduled cleanup
                    </td>
                    <td th:text="${#temporals.format(cleanupTaskRecord.cleanupDateTime, 'dd.MM.yyyy HH:mm')}">
                        10.07.2026 22:00
                    </td>
                </tr>
                </tbody>
            </table>

        </section>

        <div class="planned-task-actions">
            <form th:action="@{/admin/calculate_schedule_select}" method="get">
                <button class="standard-button"
                        type="submit"
                        data-th-text="#{sidebar.calculateSchedule}">
                    New schedule calculation
                </button>
            </form>
        </div>

    </section>

    <section class="language-section">
        <div class="language-flags centered">
            <span>
                <a th:href="@{/(language=cs)}">
                    <img alt="CZ" class="flag" th:src="@{/images/cz.png}" title="Česky">
                </a>
            </span>
            <span>
                <a th:href="@{/(language=en)}">
                    <img alt="US" class="flag" th:src="@{/images/us.png}" title="English">
                </a>
            </span>
            <span>
                <a th:href="@{/(language=de)}">
                    <img alt="DE" class="flag" th:src="@{/images/de.png}" title="Deutsch">
                </a>
            </span>
            <span>
                <a th:href="@{/(language=hu)}">
                    <img alt="HU" class="flag" th:src="@{/images/hu.png}" title="Magyar">
                </a>
            </span>
        </div>
    </section>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
