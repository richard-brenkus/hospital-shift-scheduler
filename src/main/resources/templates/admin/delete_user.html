<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <title>Delete user</title>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="centered delete-user-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{deleteUser.header}">
            Delete user
        </h1>
    </header>

    <section class="page-section">

        <form sec:authorize="hasRole('ADMIN')"
              th:action="@{/admin/delete_user}"
              method="post"
              class="delete-user-form">

            <table class="table-no-lines delete-user-table">

                <tbody>

                <tr>
                    <td class="td-no-lines delete-user-cell">
                        <label for="userId"
                               data-th-text="#{deleteUser.select}">
                            Select user
                        </label>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines delete-user-cell">
                        <select id="userId" name="userId" required>
                            <option value=""
                                    data-th-text="#{deleteUser.select}">
                                Select user
                            </option>

                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name + ' (' + user.username + ')'}">
                                User name
                            </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines delete-user-cell">
                        <button type="submit"
                                class="standard-button button-orange"
                                data-th-text="#{button.delete}"
                                th:data-confirm-message="#{userTable.confirmDelete}"
                                onclick="return confirm(this.dataset.confirmMessage);">
                            Delete
                        </button>
                    </td>
                </tr>

                </tbody>

            </table>
            <div sec:authorize="hasRole('DEMO_ADMIN') and !hasRole('ADMIN')"
                 th:replace="~{admin/fragments/demo-restriction-banner
                  :: demoRestrictionBanner(#{demo.restricted.userDeletion})}">
            </div>
        </form>

    </section>

    <nav class="page-actions centered">

        <form th:action="@{/admin/all_users_list}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.showUsers}">
                Show users
            </button>

        </form>

        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>

    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
