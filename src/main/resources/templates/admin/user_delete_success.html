<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <title>User deleted successfully</title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="centered user-delete-success-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{user.delete.success.header}">
            User deleted successfully
        </h1>
    </header>

    <section class="page-section">
        <p class="success-message"
           data-th-text="#{user.delete.success.message}">
            The user has been deleted successfully.
        </p>
    </section>

    <nav class="page-actions user-delete-success-actions centered">

        <form th:action="@{/admin/register_user}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.registerAnother}">
                Register new user
            </button>

        </form>

        <form th:action="@{/admin/all_users_list}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.showUsers}">
                Show users
            </button>

        </form>

        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>

    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
