<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <title>User deleted successfully</title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<div class="centered">

    <h1 data-th-text="#{user.delete.success.header}">
        User deleted successfully
    </h1>

    <br>

    <p data-th-text="#{user.delete.success.message}">
        The shift request has been deleted successfully.
    </p>

    <br>

    <form th:action="@{/admin/register_user}" method="get">
        <button type="submit"
                class="standard-button"
                data-th-text="#{button.registerAnother}">
            Register new user
        </button>
    </form>

    <br>

    <form th:action="@{/admin/users}" method="get">
        <button type="submit"
                class="standard-button"
                data-th-text="#{button.showUsers}">
            Show users
        </button>
    </form>

    <br>

    <form th:action="@{/admin/adminIndex}" method="get">
        <button type="submit"
                class="standard-button"
                data-th-text="#{button.backToHomePage}">
            Go back
        </button>
    </form>

</div>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
