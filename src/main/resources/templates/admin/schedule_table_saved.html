<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <title data-th-text="#{scheduleTableSaved.title}">
        Saved schedule
    </title>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main id="main" class="centered saved-schedule-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{scheduleTableSaved.header}">
            Saved schedule
        </h1>

        <h2 th:if="${savedSchedule != null && savedSchedule.month != null}"
            th:text="${#temporals.format(savedSchedule.month.atDay(1), 'MM/yyyy')}">
            01/2026
        </h2>

        <h2 th:if="${savedSchedule == null || savedSchedule.month == null}">
            <span th:text="${year}">2026</span>
            /
            <span th:text="${monthInt}">1</span>
        </h2>
    </header>

    <section class="page-section"
             th:if="${savedSchedule == null || savedSchedule.days == null || #lists.isEmpty(savedSchedule.days)}">

        <p data-th-text="#{showSavedSchedules.scheduleNonExistent}">
            The database does not contain any stored dates for the selected month/year.
        </p>

    </section>

    <section class="page-section saved-schedule-table-wrapper"
             th:if="${savedSchedule != null && savedSchedule.days != null && !#lists.isEmpty(savedSchedule.days)}">

        <table class="table-with-lines table-full saved-schedule-table">
            <colgroup>
                <col class="col-4">
                <col th:each="shiftType : ${shiftTypes}" class="col-16">
            </colgroup>

            <thead>
            <tr>
                <th data-th-text="#{scheduleTableSaved.day}">
                    Day
                </th>

                <th th:each="shiftType : ${shiftTypes}"
                    th:text="#{scheduleTable.shiftType} + ' ' + ${shiftType}">
                    Shift type
                </th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="day : ${savedSchedule.days}">
                <td class="centered"
                    th:classappend="${day.weekendOrHoliday} ? ' holiday-cell' : ''"
                    th:text="${day.date.dayOfMonth}">
                    1
                </td>

                <td th:each="assignment : ${day.assignments}"
                    class="centered"
                    th:classappend="${day.weekendOrHoliday} ? ' holiday-cell' : ''"
                    th:text="${assignment.displayName}">
                    Username
                </td>
            </tr>
            </tbody>
        </table>

    </section>

    <nav class="page-actions saved-schedule-actions centered">

        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>

        <form th:action="@{/admin/show_stored_full_statistics}"
              method="get"
              class="inline-action-form">

            <input type="hidden"
                   name="selectedMonth"
                   th:value="${savedSchedule != null && savedSchedule.month != null ? savedSchedule.month : month}"/>

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.showFullStats}">
                Show full statistics
            </button>

        </form>

        <form th:action="@{/admin/show_saved_schedules}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.backToSchedules}">
                Back to saved schedules selection
            </button>

        </form>

        <form th:action="@{/admin/download_schedule_as_spreadsheet}"
              method="post"
              class="inline-action-form">

            <input type="hidden"
                   name="selectedMonth"
                   th:value="${savedSchedule != null && savedSchedule.month != null ? savedSchedule.month : month}"/>

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.downloadSpreadsheet}">
                Download spreadsheet
            </button>

        </form>

    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
