<!DOCTYPE HTML>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
    <title>Update shift request</title>
</head>
<body>

<button class="openbtn" onclick="openNav()">menu</button>

<div class="centered">
    <h1 data-th-text="#{updateRequestSelect.header}">Update shift request</h1>

    <form action="#"
          th:action="@{/admin/update_shift_request}"
          method="post"
          th:object="${updatedUser}">

        <table class="table-no-lines table-narrow">
            <tr>
                <td class="td-no-lines">
                    <label for="requestUserSelect"
                           data-th-text="#{updateRequestSelect.select}">
                        Select the user whose shift request you would like to edit
                    </label>
                </td>
            </tr>

            <tr>
                <td class="td-no-lines">
                    <select id="requestUserSelect"
                            th:field="*{id}">
                        <option value=""
                                data-th-text="#{updateRequestSelect.requester}">
                            Select requester
                        </option>

                        <option th:each="user : ${users}"
                                th:value="${user.id}"
                                th:text="${user.name}">
                        </option>
                    </select>
                </td>

                <td class="td-no-lines error-red"
                    th:if="${#fields.hasErrors('id')}"
                    th:errors="*{id}">
                    User error
                </td>
            </tr>
        </table>

        <br>

        <button type="submit"
                class="standard-button"
                data-th-text="#{button.update}">
            Update
        </button>
    </form>

    <br>

    <form th:action="@{/admin/adminIndex}" method="get">
        <button type="submit"
                class="standard-button"
                data-th-text="#{button.backToHomePage}">
            Go back
        </button>
    </form>
</div>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
