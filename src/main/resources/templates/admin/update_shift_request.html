<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <title>Update shift request</title>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="centered update-shift-request-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{updateRequestSelect.header}">
            Update shift request
        </h1>
    </header>

    <section class="page-section">

        <form th:action="@{/admin/update_shift_request}"
              method="post"
              th:object="${updatedUser}"
              class="update-shift-request-form">

            <table class="table-no-lines update-shift-request-table">

                <tbody>

                <tr>
                    <td class="td-no-lines update-shift-request-label-cell">
                        <label for="requestUserSelect"
                               data-th-text="#{updateRequestSelect.select}">
                            Select the user whose shift request you would like to edit
                        </label>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines update-shift-request-input-cell">
                        <select id="requestUserSelect"
                                th:field="*{id}">
                            <option value=""
                                    data-th-text="#{updateRequestSelect.requester}">
                                Select requester
                            </option>

                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name}">
                                User name
                            </option>
                        </select>
                    </td>

                    <td class="td-no-lines error-red update-shift-request-error-cell"
                        th:if="${#fields.hasErrors('id')}"
                        th:errors="*{id}">
                        User error
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        data-th-text="#{button.update}">
                    Update
                </button>
            </div>

        </form>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
