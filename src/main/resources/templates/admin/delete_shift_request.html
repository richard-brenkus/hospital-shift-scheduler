<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <title>Delete shift request</title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="centered delete-shift-request-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{deleteShiftRequest.header}">
            Delete shift request
        </h1>
    </header>

    <section class="page-section">

        <!-- Full functionality for ADMIN -->
        <form sec:authorize="hasRole('ADMIN')"
              th:action="@{/admin/delete_shift_request}"
              method="post"
              th:object="${updatedUser}"
              class="delete-shift-request-form">

            <table class="table-no-lines delete-shift-request-table">

                <tbody>

                <tr>
                    <td class="td-no-lines delete-shift-request-cell">
                        <label for="requestSelect"
                               data-th-text="#{deleteShiftRequest.select}">
                            Select a shift request
                        </label>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines delete-shift-request-cell">
                        <select id="requestSelect"
                                th:field="*{id}">

                            <option value=""
                                    data-th-text="#{deleteShiftRequest.select}">
                                Select shift request
                            </option>

                            <option th:each="user : ${users}"
                                    th:value="${user.id}"
                                    th:text="${user.name}">
                                User name
                            </option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines delete-shift-request-cell">
                        <button type="submit"
                                class="standard-button button-orange"
                                data-th-text="#{button.delete}">
                            Delete
                        </button>
                    </td>
                </tr>

                </tbody>

            </table>

        </form>

        <!-- Replacement for DEMO_ADMIN -->
        <div sec:authorize="hasRole('DEMO_ADMIN') and !hasRole('ADMIN')"
             th:replace="~{admin/fragments/demo-restriction-banner
                      :: demoRestrictionBanner(#{demo.restricted.shiftRequestDeletion})}">
        </div>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
