<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <title data-th-text="#{calcSchedMenu.title}">
        Calculate schedule
    </title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<div id="existingScheduleConfirmationModal"
     class="confirmation-modal-backdrop"
     th:if="${showExistingScheduleConfirmation}">

    <section class="confirmation-modal"
             role="dialog"
             aria-modal="true"
             aria-labelledby="existingScheduleConfirmationTitle">

        <h2 id="existingScheduleConfirmationTitle"
            th:text="#{schedule.confirmExistingCalculation.title}">
            Schedule already exists
        </h2>

        <p th:text="#{schedule.confirmExistingCalculation.message(
                ${existingScheduleMonth}
        )}">
            A stored schedule already exists for this month.
            Do you really want to start another calculation?
        </p>

        <div class="confirmation-modal-actions">

            <form id="confirmedCalculationForm"
                  th:action="@{/admin/new_calculation}"
                  method="post"
                  th:object="${calculationProfileForm}"
                  onsubmit="return showCalculationProgress(this);">

                <input type="hidden"
                       th:field="*{calculationMonth}"/>

                <input type="hidden"
                       th:field="*{shiftCountCap}"/>

                <input type="hidden"
                       th:field="*{gapBetweenShifts}"/>

                <input type="hidden"
                       th:field="*{sortByDatesAmount}"/>

                <input type="hidden"
                       name="confirmed"
                       value="true"/>

                <input th:each="shiftType : *{forceFillShiftTypes}"
                       type="hidden"
                       name="forceFillShiftTypes"
                       th:value="${shiftType}"/>

                <button type="submit"
                        class="standard-button calculation-submit-button"
                        th:text="#{button.confirm}">
                    Confirm
                </button>

            </form>

            <button type="button"
                    class="standard-button"
                    onclick="closeExistingScheduleConfirmation()"
                    th:text="#{button.cancel}">
                Cancel
            </button>

        </div>

    </section>

</div>

<button class="openbtn" onclick="openNav()">menu</button>

<main id="main"
      class="centered calculate-schedule-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{calcSchedMenu.header}">
            Calculate schedule
        </h1>
    </header>

    <!-- Server-side error returned when another calculation is already active. -->
    <div class="error-red"
         th:if="${calculationErrorCode != null}"
         th:text="#{__${calculationErrorCode}__}"
         role="alert">
        Another schedule calculation is already running.
    </div>

    <!--
        Initially hidden. JavaScript displays this immediately before either
        calculation form is submitted.
    -->
    <div id="calculationProgressMessage"
         class="calculation-progress"
         style="display: none;"
         role="status"
         aria-live="polite"
         th:text="#{schedule.calculation.inProgress}">
        Schedule calculation in progress. Please wait...
    </div>

    <section class="page-section calculate-schedule-section">

        <form id="newCalculationForm"
              th:action="@{/admin/new_calculation}"
              method="post"
              th:object="${calculationProfileForm}"
              onsubmit="return showCalculationProgress(this);">

            <table class="table-no-lines calculate-schedule-table">

                <tbody>

                <tr>
                    <td class="td-no-lines calculate-schedule-label-cell">
                        <label for="calculationMonth"
                               data-th-text="#{calcSchedMenu.forMonth}">
                            Calculate for month:
                        </label>
                    </td>

                    <td class="td-no-lines calculate-schedule-input-cell">
                        <select id="calculationMonth"
                                th:field="*{calculationMonth}">
                            <option th:each="monthOption : ${monthOptions}"
                                    th:value="${monthOption.value}"
                                    th:text="${monthOption.label}">
                            </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines calculate-schedule-label-cell">
                        <label for="shiftCap"
                               data-th-text="#{calcSchedMenu.shiftCap}">
                            Shift count cap:
                        </label>
                    </td>

                    <td class="td-no-lines calculate-schedule-input-cell">
                        <select id="shiftCap"
                                th:field="*{shiftCountCap}">
                            <option th:each="shiftCount : ${shiftCountMaxList}"
                                    th:value="${shiftCount}"
                                    th:text="${shiftCount}">
                            </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines calculate-schedule-label-cell">
                        <label for="minGap"
                               data-th-text="#{calcSchedMenu.minGap}">
                            Minimal gap between two shifts:
                        </label>
                    </td>

                    <td class="td-no-lines calculate-schedule-input-cell">
                        <select id="minGap"
                                th:field="*{gapBetweenShifts}">
                            <option th:each="minimalGap : ${gapBetweenShiftsList}"
                                    th:value="${minimalGap}"
                                    th:text="${minimalGap}">
                            </option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines calculate-schedule-label-cell">
                        <label for="sortByDates"
                               data-th-text="#{calcSchedMenu.sortByDates}">
                            Sort by dates amount:
                        </label>
                    </td>

                    <td class="td-no-lines calculate-schedule-input-cell">
                        <input type="checkbox"
                               id="sortByDates"
                               th:field="*{sortByDatesAmount}"/>
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines calculate-schedule-label-cell">
                        <span data-th-text="#{calcSchedMenu.calculationTypePriority}">
                            Calculation type priority:
                        </span>
                    </td>

                    <td class="td-no-lines calculate-schedule-input-cell">
                        <div class="checkbox-list">
                            <div th:each="shiftType : ${shiftTypes}"
                                 class="checkbox-list-item">

                                <label>
                                    <input type="checkbox"
                                           th:id="${'forceFill' + shiftType}"
                                           th:field="*{forceFillShiftTypes}"
                                           th:value="${shiftType}"/>
                                </label>

                                <label th:for="${'forceFill' + shiftType}"
                                       th:text="|#{calcSchedMenu.forceFill} ${shiftType}|">
                                    Force fill
                                </label>

                            </div>
                        </div>
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button calculation-submit-button"
                        data-th-text="#{calcSchedMenu.calculate}">
                    Calculate
                </button>
            </div>

        </form>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    let calculationSubmissionStarted = false;

    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }

    function closeExistingScheduleConfirmation() {
        const modal = document.getElementById(
            "existingScheduleConfirmationModal"
        );

        if (modal !== null) {
            modal.style.display = "none";
        }
    }

    function showCalculationProgress(submittedForm) {
        if (calculationSubmissionStarted) {
            return false;
        }

        calculationSubmissionStarted = true;

        /*
         * Hide the confirmation dialog.
         */
        closeExistingScheduleConfirmation();

        /*
         * Display the progress message.
         */
        const progressMessage =
            document.getElementById("calculationProgressMessage");

        if (progressMessage !== null) {
            progressMessage.style.display = "block";

            progressMessage.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        /*
         * Disable buttons to prevent duplicate submissions.
         *
         * Do not disable input, select, or textarea elements:
         * disabled form controls are omitted from the POST request.
         */
        document.querySelectorAll("button")
            .forEach(button => {
                button.disabled = true;
            });

        submittedForm.setAttribute("aria-busy", "true");
        submittedForm.classList.add("calculation-form-busy");

        /*
         * Give the browser time to hide the modal and render the
         * progress message before submitting.
         */
        window.setTimeout(() => {
            submittedForm.submit();
        }, 75);

        return false;
    }
</script>

</body>
</html>
