<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <title>User Registration</title>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main id="main" class="centered register-user-wrapper">

    <section class="page-section">

        <form th:action="@{/admin/add}"
              method="post"
              th:object="${userRegisterForm}"
              class="register-user-form">

            <table class="table-no-lines register-user-table">

                <tbody>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="title" data-th-text="#{register.title}">
                            Title:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="title" th:field="*{title}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('title')}"
                        th:errors="*{title}">
                        Title Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="name" data-th-text="#{register.name}">
                            Name:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="name" th:field="*{name}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                        Name Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="username" data-th-text="#{register.username}">
                            Username:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="username" th:field="*{username}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('username')}"
                        th:errors="*{username}">
                        Username Error
                    </td>
                </tr>

                <tr th:if="*{id != null}">
                    <td class="td-no-lines register-user-label-cell">
                        <label for="userId" data-th-text="#{register.id}">
                            ID:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text"
                               id="userId"
                               th:readonly="true"
                               th:field="*{id}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('id')}"
                        th:errors="*{id}">
                        ID Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="birthday" data-th-text="#{register.birth}">
                            Date of birth:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="birthday" th:field="*{birthday}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('birthday')}"
                        th:errors="*{birthday}">
                        Birthday Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="email" data-th-text="#{register.email}">
                            Email:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="email" th:field="*{email}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('email')}"
                        th:errors="*{email}">
                        Email Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="password" data-th-text="#{register.password}">
                            Password:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="password" id="password" th:field="*{password}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('password')}"
                        th:errors="*{password}">
                        Password Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="note" data-th-text="#{register.note}">
                            Note:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <input type="text" id="note" th:field="*{note}"/>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('note')}"
                        th:errors="*{note}">
                        Note Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell">
                        <label for="profession" data-th-text="#{register.profession}">
                            Profession:
                        </label>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <select th:field="*{profession}" id="profession">
                            <option value="" data-th-text="#{register.selectProfession}">
                                Select profession
                            </option>

                            <option th:each="profession : ${professions}"
                                    th:value="${profession.name()}"
                                    th:text="#{__${'profession.' + profession.name()}__}">
                                Profession
                            </option>
                        </select>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('profession')}"
                        th:errors="*{profession}">
                        Profession Error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines register-user-label-cell register-user-top-aligned">
                        <span data-th-text="#{register.allowedShiftTypes}">
                            Allowed shift types:
                        </span>
                    </td>

                    <td class="td-no-lines register-user-input-cell">
                        <div class="checkbox-list">
                            <div th:each="shiftType : ${shiftTypes}"
                                 class="checkbox-list-item">

                                <label>
                                    <input type="checkbox"
                                           th:id="'shiftType-' + ${shiftType}"
                                           th:value="${shiftType}"
                                           th:field="*{allowedShiftTypes}"/>
                                </label>

                                <label th:for="'shiftType-' + ${shiftType}">
                                    <span th:text="#{__${'shiftType' + shiftType}__}">Shift type</span>
                                    <span th:text="${shiftType}">1</span>
                                </label>

                            </div>
                        </div>
                    </td>

                    <td class="td-no-lines error-red register-user-error-cell"
                        th:if="${#fields.hasErrors('allowedShiftTypes')}"
                        th:errors="*{allowedShiftTypes}"
                        data-th-text="#{register.selectOne}">
                        Select at least one
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        data-th-text="#{register.save}">
                    Save user
                </button>
            </div>

            <!-- Database errors that are not associated with a single form field. -->
            <div class="register-user-global-errors error-red"
                 th:if="${#fields.hasGlobalErrors()}"
                 role="alert"
                 aria-live="polite">

                <p th:each="error : ${#fields.globalErrors()}"
                   th:text="${error}">
                    The user could not be saved because of a database error.
                </p>

            </div>

        </form>

    </section>

    <nav class="page-actions centered">
        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>
    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
        const main = document.getElementById("main");
        if (main) {
            main.style.marginLeft = "250px";
        }
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
        const main = document.getElementById("main");
        if (main) {
            main.style.marginLeft = "0";
        }
    }
</script>

</body>
</html>
