<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-th-text="#{fullStats.title}">Schedule statistics</title>

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>

    <link rel="stylesheet"
          type="text/css"
          href="https://cdn.datatables.net/1.13.1/css/jquery.dataTables.css">

    <script src="https://cdn.datatables.net/1.13.1/js/jquery.dataTables.js"></script>

    <script>
        $(document).ready(function () {
            $("#fullStatsTable").DataTable();
        });
    </script>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main id="main" class="centered full-stats-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{fullStats.header}">
            Schedule statistics
        </h1>

        <h2 th:if="${month != null}"
            th:text="${#temporals.format(month.atDay(1), 'MM/yyyy')}">
            01/2026
        </h2>

        <h2 th:if="${month == null}">
            <span th:text="${year}">2026</span>
            /
            <span th:text="${monthInt}">1</span>
        </h2>
    </header>

    <section class="page-section">

        <p th:if="${!statsExist}"
           class="centered"
           data-th-text="#{fullStats.noStats}">
            No statistics available.
        </p>

        <div th:if="${statsExist}" class="full-stats-table-wrapper">

            <table class="table-with-lines table-full full-stats-table"
                   id="fullStatsTable">

                <colgroup>
                    <col class="col-5">
                    <col class="col-15">
                    <col class="col-15">
                    <col class="col-10">
                    <col class="col-10">
                    <col class="col-10">
                    <col class="col-10">
                    <col class="col-10">
                    <col class="col-10">
                    <col class="col-5">
                </colgroup>

                <thead>
                <tr>
                    <th data-th-text="#{fullStats.tableHeader.shiftType}">
                        Shift type
                    </th>
                    <th class="left-aligned"
                        data-th-text="#{fullStats.tableHeader.name}">
                        Name
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.dates}">
                        Dates
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.requested.weekdays}">
                        Requested weekdays
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.requested.weekends}">
                        Requested weekends
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.assigned.weekdays}">
                        Assigned weekdays
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.assigned.weekends}">
                        Assigned weekends
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.remaining.weekdays}">
                        Remaining weekdays
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.remaining.weekends}">
                        Remaining weekends
                    </th>
                    <th data-th-text="#{fullStats.tableHeader.sum}">
                        Sum of shifts
                    </th>
                </tr>
                </thead>

                <tbody>
                <th:block th:each="shiftType : ${shiftTypes}">
                    <tr th:each="userStat : ${fullUserStatsByShiftType.get(shiftType)}">

                        <td class="centered"
                            th:text="${shiftType}">
                            1
                        </td>

                        <td class="left-aligned"
                            th:text="${userStat.name}">
                            Username
                        </td>

                        <td class="centered"
                            th:text="${userStat.assignedDateDays}">
                            [1, 2, 3]
                        </td>

                        <td class="centered"
                            th:text="${userStat.requestedWeekdays}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.requestedWeekends}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.assignedWeekdays}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.assignedWeekends}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.remainingWeekdays}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.remainingWeekends}">
                            0
                        </td>

                        <td class="centered"
                            th:text="${userStat.assignedTotalAllShiftTypes}">
                            0
                        </td>

                    </tr>
                </th:block>
                </tbody>

            </table>

        </div>

    </section>

    <nav class="page-actions full-stats-actions centered">

        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>

        <form th:action="@{/admin/all_users_list}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.showUsers}">
                Users list
            </button>

        </form>

        <form th:action="@{/admin/show_saved_schedules}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.backToSchedules}">
                Back to saved-schedule selection
            </button>

        </form>

    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
