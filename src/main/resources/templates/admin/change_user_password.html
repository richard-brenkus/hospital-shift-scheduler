<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>

    <title data-th-text="#{adminPasswordChange.title}">
        Change user password
    </title>
</head>

<body>

<button class="openbtn" onclick="openNav()">menu</button>

<main class="centered password-change-wrapper">

    <header class="page-header">
        <h1 data-th-text="#{adminPasswordChange.header}">
            Change user password
        </h1>
    </header>

    <section class="page-section">

        <p class="selected-user-info">
            <span data-th-text="#{adminPasswordChange.selectedUser}">
                Selected user:
            </span>
            <strong th:text="${selectedUser.name}">User name</strong>
        </p>

        <form th:action="@{/admin/change_user_password}"
              method="post"
              th:object="${passwordChangeForm}"
              class="password-change-form">

            <input type="hidden"
                   name="userId"
                   th:value="${selectedUser.userId}"/>

            <table class="table-no-lines password-change-table">

                <tbody>

                <tr>
                    <td class="td-no-lines password-change-label-cell">
                        <label for="newPassword"
                               data-th-text="#{adminPasswordChange.newPassword}">
                            New password
                        </label>
                    </td>

                    <td class="td-no-lines password-change-input-cell">
                        <input id="newPassword"
                               type="password"
                               th:field="*{newPassword}"/>
                    </td>

                    <td class="td-no-lines error-red password-change-error-cell"
                        th:if="${#fields.hasErrors('newPassword')}"
                        th:errors="*{newPassword}">
                        Password error
                    </td>
                </tr>

                <tr>
                    <td class="td-no-lines password-change-label-cell">
                        <label for="confirmedPassword"
                               data-th-text="#{adminPasswordChange.confirmedPassword}">
                            Confirm password
                        </label>
                    </td>

                    <td class="td-no-lines password-change-input-cell">
                        <input id="confirmedPassword"
                               type="password"
                               th:field="*{confirmedPassword}"/>
                    </td>

                    <td class="td-no-lines error-red password-change-error-cell"
                        th:if="${#fields.hasErrors('confirmedPassword')}"
                        th:errors="*{confirmedPassword}">
                        Confirmation error
                    </td>
                </tr>

                </tbody>

            </table>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        data-th-text="#{button.save}">
                    Save
                </button>
            </div>

        </form>

    </section>

    <nav class="page-actions centered">

        <form th:action="@{/admin/select_user_password_change}"
              method="get"
              class="inline-action-form">

            <button type="submit"
                    class="standard-button"
                    data-th-text="#{button.back}">
                Back
            </button>

        </form>

        <a th:href="@{/admin/adminIndex}"
           class="standard-button button-link"
           data-th-text="#{button.backToHomePage}">
            Back to home page
        </a>

    </nav>

</main>

<div th:replace="~{admin/fragments/sidebar-admin :: adminSidebar}"></div>

<script>
    function openNav() {
        document.getElementById("adminSidebar").style.width = "250px";
    }

    function closeNav() {
        document.getElementById("adminSidebar").style.width = "0";
    }
</script>

</body>
</html>
