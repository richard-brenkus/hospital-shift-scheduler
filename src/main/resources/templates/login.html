<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/styles/main.css}"/>
</head>

<body>

<main class="centered login-wrapper">

    <header class="page-header">

        <h1 data-th-text="#{login.header}">
            Please Log In
        </h1>

        <div class="language-flags">
            <a th:href="@{/login(language=cs)}">
                <img alt="CZ" class="flag" th:src="@{/images/cz.png}" title="Česky">
            </a>

            <a th:href="@{/login(language=en)}">
                <img alt="US" class="flag" th:src="@{/images/us.png}" title="English">
            </a>

            <a th:href="@{/login(language=de)}">
                <img alt="DE" class="flag" th:src="@{/images/de.png}" title="Deutsch">
            </a>

            <a th:href="@{/login(language=hu)}">
                <img alt="HU" class="flag" th:src="@{/images/hu.png}" title="Magyar">
            </a>
        </div>

    </header>

    <section class="login-message-section">

        <p th:if="${param.error}"
           class="login-message error-red"
           data-th-text="#{login.error}">
            Invalid username and password.
        </p>

        <p th:if="${param.logout}"
           class="login-message"
           data-th-text="#{login.logout}">
            You have been logged out.
        </p>

    </section>

    <section class="page-section">

        <form th:action="@{/login}"
              method="post"
              class="login-form">

            <div class="login-field">
                <label for="username" class="visually-hidden" data-th-text="#{label.username}">
                    Username
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       th:placeholder="#{label.username}"
                       autocomplete="username"
                       required
                       autofocus/>
            </div>

            <div class="login-field">
                <label for="password" class="visually-hidden" data-th-text="#{label.password}">
                    Password
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       th:placeholder="#{label.password}"
                       autocomplete="current-password"
                       required/>
            </div>

            <div class="form-actions">
                <button type="submit"
                        class="standard-button"
                        data-th-text="#{button.login}">
                    Log in
                </button>
            </div>

        </form>

    </section>

    <!-- Portfolio / source-code link -->
    <footer class="login-project-link">

        <a href="https://github.com/richard-brenkus/hospital-shift-scheduler"
           class="github-project-button"
           target="_blank"
           rel="noopener noreferrer">

            <svg class="github-project-icon"
                 viewBox="0 0 24 24"
                 aria-hidden="true">
                <path fill="currentColor"
                      d="M12 .7C5.7.7.6 5.8.6 12.1c0 5 3.3 9.3 7.8 10.8.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.3 1 .1-.8.4-1.3.8-1.6-2.6-.3-5.3-1.3-5.3-5.7 0-1.3.5-2.3 1.2-3.1-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.2 1.2a11 11 0 0 1 5.8 0C17.2 4.7 18.2 5 18.2 5c.6 1.6.2 2.8.1 3.1.8.8 1.2 1.8 1.2 3.1 0 4.4-2.7 5.4-5.3 5.7.4.4.8 1.1.8 2.1v3.3c0 .3.2.7.8.6a11.5 11.5 0 0 0 7.8-10.8C23.4 5.8 18.3.7 12 .7Z"/>
            </svg>

            <span data-th-text="#{login.github}">
                View project on GitHub
            </span>

        </a>

    </footer>

</main>

</body>
</html>
