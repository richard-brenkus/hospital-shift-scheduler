spring.application.name=hospital-shift-scheduler
#spring.profiles.active=dev

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_shift_scheduler?serverTimezone=Europe/Prague
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA
#TODO: change from update to validate before deployment
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Thymeleaf
spring.thymeleaf.cache=false

# Languages
spring.messages.basename=language/messages
spring.messages.encoding=UTF-8

# Session
server.servlet.session.persistent=false
server.servlet.session.cookie.name=HOSPITAL_SHIFT_SCHEDULER_SESSION
server.servlet.session.timeout=10m

# Logging
logging.level.org.hibernate.SQL=ERROR

# Server
server.port=8080

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000

# Application
app.shift-types.count=6
# Application timezone used for planned task execution. It keeps reminders and cleanup aligned with Czech time even on a cloud server in another timezone.
app.time-zone=Europe/Prague

# Planned tasks
planned-tasks.outbox.fixed-delay-ms=10000
planned-tasks.outbox.recovery-delay-ms=60000
planned-tasks.outbox.batch-size=20
planned-tasks.outbox.claim-timeout-minutes=10
planned-tasks.outbox.recovery-batch-size=100
planned-tasks.outbox.maximum-attempts=5
# How often the executor checks the database for due planned tasks.
planned-tasks.executor.fixed-delay-ms=60000
# Reminder email message ID
app.mail.message-id-domain=hospital-shift-scheduler

# Schedule calculation multithreading
app.schedule-calculation.number-of-threads=4
app.schedule-calculation.attempts-per-thread=1000
app.schedule-calculation.timeout=PT5M

# Activity-event Kafka adapter
# Disabled by default. No ActivityEvent is sent to Kafka while false.
application.kafka.activity.enabled=${ACTIVITY_KAFKA_ENABLED:false}
# These values are ignored while the adapter is disabled:
application.kafka.activity.bootstrap-servers=${ACTIVITY_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
application.kafka.activity.topic=${ACTIVITY_KAFKA_TOPIC:hospital-shift-scheduler.activity-events.v1}
application.kafka.activity.client-id=${ACTIVITY_KAFKA_CLIENT_ID:hospital-shift-scheduler-activity-producer}




